<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alle Heimwerker-Ratgeber – Anleitungen & Tipps</title>
  <meta name="description" content="Alle Heimwerker-Ratgeber auf einen Blick: Renovieren, Streichen, Fliesen, Sanitär, Dämmen, Elektro und mehr. Kostenlos und direkt umsetzbar." />
  <link rel="canonical" href="https://USERNAME.github.io/heimwerker-tipps-de/blog/" />
  <link rel="stylesheet" href="../style.css" />
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="logo">🔨 Heimwerker-Tipps</a>
    <nav>
      <a href="/">Start</a>
      <a href="/blog/">Alle Artikel</a>
    </nav>
  </div>
</header>

<main class="blog-index container">

  <h1>Alle Ratgeber</h1>
  <p class="subtitle">Wöchentlich neue Anleitungen – zuletzt aktualisiert <span id="last-updated"></span></p>

  <div style="margin-bottom:24px;">
    <label for="filter-select" style="font-weight:600;margin-right:8px;">Thema:</label>
    <select id="filter-select" style="padding:6px 12px;border:1px solid #ddd;border-radius:6px;font-size:0.95rem;">
      <option value="">Alle</option>
      <option value="Böden">Böden</option>
      <option value="Streichen">Streichen</option>
      <option value="Fliesen">Fliesen</option>
      <option value="Bad">Bad</option>
      <option value="Küche">Küche</option>
      <option value="Dämmen">Dämmen</option>
      <option value="Elektro">Elektro</option>
      <option value="Garten">Garten</option>
      <option value="Energie">Energie</option>
      <option value="Dach">Dach</option>
      <option value="Wartung">Wartung</option>
      <option value="Holz">Holz</option>
      <option value="Feuchte">Feuchte</option>
      <option value="Sanitär">Sanitär</option>
      <option value="Trockenbau">Trockenbau</option>
    </select>
  </div>

  <div class="post-grid" id="post-grid">
    <p style="color:#999;">Artikel werden geladen …</p>
  </div>

</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2025 Heimwerker-Tipps.de &nbsp;|&nbsp; <a href="/impressum.html">Impressum</a> &nbsp;|&nbsp; <a href="/datenschutz.html">Datenschutz</a></p>
    <p class="affiliate-hint">* Amazon-Links sind Affiliate-Links. Als Amazon-Partner verdiene ich an qualifizierten Verkäufen.</p>
  </div>
</footer>

<script>
let allPosts = [];

fetch('/blog/posts/index.json')
  .then(r => r.json())
  .then(posts => {
    allPosts = posts;
    if (posts.length > 0) {
      document.getElementById('last-updated').textContent = posts[0].date_de;
    }

    // URL-Parameter für Filter auslesen
    const params = new URLSearchParams(window.location.search);
    const filterParam = params.get('filter') || '';
    if (filterParam) {
      document.getElementById('filter-select').value = filterParam;
    }

    renderPosts(filterParam);
  })
  .catch(() => {
    document.getElementById('post-grid').innerHTML =
      '<p style="color:#999;">Die ersten Artikel erscheinen automatisch ab dem ersten Montag nach dem Go-Live.</p>';
  });

document.getElementById('filter-select').addEventListener('change', function() {
  renderPosts(this.value);
});

function renderPosts(filter) {
  const grid = document.getElementById('post-grid');
  const filtered = filter ? allPosts.filter(p => p.label === filter) : allPosts;

  if (filtered.length === 0) {
    grid.innerHTML = '<p style="color:#999;">Keine Artikel in dieser Kategorie gefunden.</p>';
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="post-card">
      <a class="card-link" href="${p.url}">
        <img src="${p.og_image}" alt="${p.h1}" loading="lazy" />
        <div class="post-card-body">
          <span class="label">${p.label}</span>
          <h2>${p.h1}</h2>
          <p>${p.meta_description}</p>
          <time>${p.date_de}</time>
        </div>
      </a>
    </div>
  `).join('');
}
</script>

</body>
</html>
